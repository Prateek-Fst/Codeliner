<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4fd" />
      <stop offset="100%" stop-color="#003ace" />
    </linearGradient>
    <linearGradient id="seven-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00b4fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Subtle dark background circular badge -->
  <rect width="128" height="128" rx="32" fill="#031e2a" />
  
  <!-- Glow ring -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#n-grad)" stroke-width="2" opacity="0.4" />
  
  <!-- Geometric N -->
  <path d="M28 92 V36 L60 92 V36" fill="none" stroke="url(#n-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Geometric 7 -->
  <path d="M72 36 H100 L76 92" fill="none" stroke="url(#seven-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
